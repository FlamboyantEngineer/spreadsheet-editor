name: Pin bump

# Proposes moving the git pin of the base component library to the head of its `dev` branch, as
# one tested set (README, Tested set): the set is installed with strict peers and must pass the
# packed-consumer check before the pull request opens, and the pull request merges by itself only
# once `check` passes. It needs the repository to let GitHub Actions create pull requests and to
# allow auto-merge.
on:
  schedule:
    - cron: '23 5 * * 1-5'
  workflow_dispatch:
concurrency:
  group: pin-bump
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: write
env:
  BRANCH: pin-bump/dev
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Move the pin, install strictly and check the packed consumer
        id: bump
        run: |
          node scripts/bump-pins.mjs
          if grep -q '^changed=true' "$GITHUB_OUTPUT"; then
            npm install --strict-peer-deps --no-audit --no-fund
            npm ci --strict-peer-deps --no-audit --no-fund
            npm run build
            npm run check:consumer
          fi
      # A pull request opened with the workflow's token starts no workflow, so the workflow starts
      # CI on the branch itself; its `check` lands on the branch's head commit, where the rules read it.
      - name: Propose the set
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.bump.outputs.body }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git commit -am 'Move the git pin to the head of dev'
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body "$BODY"
          else
            gh pr create --base dev --head "$BRANCH" --title 'Move the git pin to the head of dev' --body "$BODY"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$BRANCH" --auto --merge
