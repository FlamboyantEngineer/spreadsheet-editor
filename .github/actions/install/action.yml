name: Install
description: Node from .nvmrc, the npm download cache and, when asked, the installed tree kept per lock file.
inputs:
  modules:
    description: Restore node_modules for this lock file, or install it with `npm ci` on a miss. The gates job passes false to install from a clean checkout.
    default: 'true'
runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .nvmrc
    # Downloaded packages, kept across lock changes: a newer lock still finds most of them. Every
    # install also prepares the ui-components git pin (its own install and build), which no cache
    # skips, so the kept tree below is what saves the install.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-
    # The installed tree for exactly this lock file and Node version, never an older one: a kept tree
    # may only save time, never change what is tested.
    - id: modules
      if: inputs.modules == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', '.nvmrc') }}
    - if: inputs.modules == 'true' && steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
